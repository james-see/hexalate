[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hexalate"
version = "0.3.1"
description = "A package for generating hexagonal tessellations"
readme = "README.md"
license = "MIT"
authors = [{ name = "James Campbell", email = "james@jamescampbell.us" }]
maintainers = [{ name = "James Campbell", email = "james@jamescampbell.us" }]
requires-python = ">=3.10"
keywords = ["hexagon", "tessellation", "hexgrid", "geometry", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
]

[project.urls]
Homepage = "https://github.com/james-see/hexalate"
Repository = "https://github.com/james-see/hexalate"
Issues = "https://github.com/james-see/hexalate/issues"

[project.scripts]
hexalate = "hexalate.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
mcp = [
    "mcp>=1.0.0,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["hexalate"]

[tool.coverage.run]
branch = true
source = ["hexalate"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["mcp", "examples", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-q"
