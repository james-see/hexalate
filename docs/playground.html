<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hexalate playground</title>
  <meta name="description" content="Try hexalate in your browser — no install needed. Powered by Pyodide (Python in WebAssembly)." />
  <script src="https://cdn.jsdelivr.net/pyodide/v0.27.5/full/pyodide.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a1520; --bg2: #0f1e2e; --accent: #e8d88a; --muted: #8ab0c8;
      --text: #d0dde8; --code: #1a2f45; --border: #1e3450; --green: #4caf88;
      --red: #e57373;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }

    nav {
      background: rgba(10,21,32,0.95); border-bottom: 1px solid var(--border);
      padding: 0.6rem 1.5rem; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    nav .logo { color: var(--accent); font-family: monospace; font-size: 1.1rem; font-weight: bold; text-decoration: none; }
    nav .links a { color: var(--muted); text-decoration: none; font-size: 0.9rem; margin-left: 1.2rem; }
    nav .links a:hover { color: var(--accent); }

    .layout { display: flex; flex: 1; min-height: 0; }

    /* Editor panel */
    .editor-panel { display: flex; flex-direction: column; width: 42%; border-right: 1px solid var(--border); }
    .panel-header {
      padding: 0.6rem 1rem; background: var(--bg2); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .panel-header h2 { font-size: 0.85rem; color: var(--muted); font-weight: normal; font-family: monospace; }
    .run-btn {
      background: var(--accent); color: var(--bg); border: none; padding: 0.35rem 1rem;
      border-radius: 4px; font-family: monospace; font-size: 0.85rem; font-weight: bold;
      cursor: pointer; transition: opacity 0.15s;
    }
    .run-btn:hover { opacity: 0.85; }
    .run-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #editor {
      flex: 1; background: var(--code); color: var(--text); border: none; outline: none;
      padding: 1rem; font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 0.85rem;
      line-height: 1.6; resize: none; tab-size: 4;
    }

    /* Output panel */
    .output-panel { display: flex; flex-direction: column; flex: 1; min-width: 0; }
    .output-tabs { display: flex; background: var(--bg2); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .tab {
      padding: 0.55rem 1.2rem; font-family: monospace; font-size: 0.82rem; color: var(--muted);
      cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.15s;
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .tab-content { flex: 1; min-height: 0; display: none; }
    .tab-content.active { display: flex; flex-direction: column; }

    #console-output {
      flex: 1; padding: 1rem; font-family: monospace; font-size: 0.82rem; line-height: 1.6;
      overflow-y: auto; white-space: pre-wrap; word-break: break-word;
    }
    .console-line-out  { color: var(--text); }
    .console-line-err  { color: var(--red); }
    .console-line-info { color: var(--muted); font-style: italic; }
    .console-line-ok   { color: var(--green); }

    #image-output {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 1rem; overflow: auto; background: var(--bg);
    }
    #image-output img { max-width: 100%; max-height: 100%; border-radius: 6px; }
    #image-placeholder { color: var(--border); font-family: monospace; font-size: 0.9rem; text-align: center; }

    /* Status bar */
    .status-bar {
      padding: 0.3rem 1rem; background: var(--bg2); border-top: 1px solid var(--border);
      font-family: monospace; font-size: 0.75rem; color: var(--muted); flex-shrink: 0;
      display: flex; justify-content: space-between;
    }
    #status-msg { }
    #status-msg.ok  { color: var(--green); }
    #status-msg.err { color: var(--red); }

    /* Example snippets sidebar */
    .examples-bar {
      width: 0; overflow: hidden; transition: width 0.2s; background: var(--bg2);
      border-left: 1px solid var(--border); flex-shrink: 0;
    }
    .examples-bar.open { width: 220px; overflow-y: auto; }
    .example-item {
      padding: 0.7rem 1rem; border-bottom: 1px solid var(--border);
      cursor: pointer; font-size: 0.82rem;
    }
    .example-item:hover { background: var(--code); }
    .example-item h4 { color: var(--accent); font-family: monospace; margin-bottom: 0.2rem; font-size: 0.82rem; }
    .example-item p  { color: var(--muted); font-size: 0.75rem; line-height: 1.4; }

    .examples-toggle {
      position: absolute; right: 0; top: 50%; transform: translateY(-50%);
      background: var(--bg2); border: 1px solid var(--border); border-right: none;
      color: var(--muted); padding: 0.5rem 0.3rem; cursor: pointer; border-radius: 4px 0 0 4px;
      font-size: 0.75rem; writing-mode: vertical-rl;
    }
  </style>
</head>
<body>

<nav>
  <a class="logo" href="index.html">hexalate</a>
  <div class="links">
    <a href="index.html">Docs</a>
    <a href="https://github.com/james-see/hexalate" target="_blank">GitHub</a>
    <a href="https://pypi.org/project/hexalate/" target="_blank">PyPI</a>
  </div>
</nav>

<div class="layout">

  <!-- Editor -->
  <div class="editor-panel">
    <div class="panel-header">
      <h2>Python — hexalate playground</h2>
      <button class="run-btn" id="run-btn" disabled>⏳ Loading…</button>
    </div>
    <textarea id="editor" spellcheck="false">import hexalate as hx

# Create a 10x8 pointy-top grid
grid = hx.HexGrid(10, 8, 0.5)
print(f"Grid has {len(grid)} hexagons")

# Axial coordinate lookup
h = grid.get(2, 3)
print(f"Hex (2,3): center=({h.x:.2f}, {h.y:.2f}), s={h.s}")
print(f"Neighbors: {len(grid.neighbors(2, 3))}")

# Distance between two hexes
a = grid.get(0, 0)
b = grid.get(4, 2)
print(f"Distance (0,0) → (4,2): {a.distance_to(b)}")

# Export to DataFrame
df = grid.to_dataframe()
print(df.head(3).to_string())

# Plot colored by distance from center — saves to /tmp/out.png
import math
cx = sum(h.x for h in grid) / len(grid)
cy = sum(h.y for h in grid) / len(grid)
origin = min(grid, key=lambda h: (h.x-cx)**2 + (h.y-cy)**2)
values = [origin.distance_to(h) for h in grid]

grid.plot(
    values=values,
    colormap="coolwarm",
    output="/tmp/out.png",
    figsize=(8, 6),
)
print("Plot saved — check the Image tab ↗")
</textarea>
  </div>

  <!-- Output -->
  <div class="output-panel">
    <div class="output-tabs">
      <div class="tab active" data-tab="console">Console</div>
      <div class="tab" data-tab="image">Image</div>
    </div>

    <div class="tab-content active" id="tab-console">
      <div id="console-output"><span class="console-line-info">Loading Python (Pyodide) — first load takes ~10s…</span>
</div>
    </div>

    <div class="tab-content" id="tab-image">
      <div id="image-output">
        <div id="image-placeholder">Run code that saves a plot to /tmp/out.png<br>and it will appear here.</div>
      </div>
    </div>
  </div>

</div>

<div class="status-bar">
  <span id="status-msg">Initialising…</span>
  <span>Python 3.x · Pyodide · hexalate</span>
</div>

<script>
// ---------------------------------------------------------------------------
// Tab switching
// ---------------------------------------------------------------------------
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(`tab-${tab.dataset.tab}`).classList.add('active');
  });
});

// ---------------------------------------------------------------------------
// Console helpers
// ---------------------------------------------------------------------------
const consoleEl = document.getElementById('console-output');

function log(text, cls = 'console-line-out') {
  const line = document.createElement('span');
  line.className = cls;
  line.textContent = text + '\n';
  consoleEl.appendChild(line);
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

function clearConsole() {
  consoleEl.innerHTML = '';
}

function setStatus(msg, cls = '') {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = cls;
}

// ---------------------------------------------------------------------------
// Image display
// ---------------------------------------------------------------------------
function tryShowImage() {
  try {
    const data = pyodide.FS.readFile('/tmp/out.png');
    const blob = new Blob([data], { type: 'image/png' });
    const url = URL.createObjectURL(blob);
    const imgEl = document.getElementById('image-output');
    imgEl.innerHTML = `<img src="${url}" alt="hexalate plot" />`;
    // Auto-switch to image tab
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelector('[data-tab="image"]').classList.add('active');
    document.getElementById('tab-image').classList.add('active');
  } catch (e) {
    // No /tmp/out.png written — that's fine
  }
}

// ---------------------------------------------------------------------------
// Pyodide init
// ---------------------------------------------------------------------------
let pyodide = null;

async function initPyodide() {
  setStatus('Loading Pyodide…');
  pyodide = await loadPyodide();

  setStatus('Installing packages…');
  await pyodide.loadPackage(['micropip', 'matplotlib', 'numpy']);

  // Redirect stdout/stderr
  pyodide.setStdout({ batched: (s) => log(s) });
  pyodide.setStderr({ batched: (s) => log(s, 'console-line-err') });

  // Install hexalate + pandas from PyPI via micropip
  await pyodide.runPythonAsync(`
import micropip
await micropip.install(['hexalate', 'pandas'])
import matplotlib
matplotlib.use('Agg')
print("✓ hexalate ready")
`);

  setStatus('Ready', 'ok');
  const btn = document.getElementById('run-btn');
  btn.textContent = '▶ Run';
  btn.disabled = false;

  clearConsole();
  log('✓ hexalate loaded — edit the code and click Run', 'console-line-ok');
}

// ---------------------------------------------------------------------------
// Run code
// ---------------------------------------------------------------------------
async function runCode() {
  const btn = document.getElementById('run-btn');
  btn.disabled = true;
  btn.textContent = '⏳ Running…';

  clearConsole();
  setStatus('Running…');

  // Delete previous output so we don't stale-display
  try { pyodide.FS.unlink('/tmp/out.png'); } catch (_) {}

  const code = document.getElementById('editor').value;
  try {
    await pyodide.runPythonAsync(code);
    setStatus('Done', 'ok');
    tryShowImage();
  } catch (err) {
    log(String(err), 'console-line-err');
    setStatus('Error', 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = '▶ Run';
  }
}

document.getElementById('run-btn').addEventListener('click', runCode);

// Ctrl/Cmd+Enter to run
document.getElementById('editor').addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    if (!document.getElementById('run-btn').disabled) runCode();
  }
});

// Tab key inserts spaces in editor
document.getElementById('editor').addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const ta = e.target;
    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    ta.value = ta.value.substring(0, start) + '    ' + ta.value.substring(end);
    ta.selectionStart = ta.selectionEnd = start + 4;
  }
});

// Start
initPyodide().catch(err => {
  log('Failed to load Pyodide: ' + err, 'console-line-err');
  setStatus('Load failed', 'err');
});
</script>

</body>
</html>
